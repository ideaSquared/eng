name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # dist/ is committed so `pnpm add -g github:ideaSquared/eng` works without a build step.
      - name: dist/ matches src/
        run: |
          pnpm build
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --porcelain -- dist
            echo "::error::dist/ is out of date. Run pnpm build and commit it."
            exit 1
          fi
      - name: Packed CLI installs and runs
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP/pack"
          npm install -g "$RUNNER_TEMP"/pack/*.tgz
          test "$(eng --version)" = "$(node -p "require('./package.json').version")"
      - name: Installers parse
        run: |
          bash -n install.sh
          shellcheck install.sh
          pwsh -NoProfile -Command '$e = $null; [System.Management.Automation.Language.Parser]::ParseFile("install.ps1", [ref]$null, [ref]$e) | Out-Null; if ($e) { $e; exit 1 }'
      - name: eng doctor runs
        run: node dist/cli.js doctor || true
